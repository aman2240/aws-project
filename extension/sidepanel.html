<!DOCTYPE html>
<!-- Side panel UI: one-time identity setup screen (gates Start until
     filled in), Start/Stop controls, the "Ghost is listening" consent
     indicator, the live/historical decision list, the triggered/
     answered expanded view, and search (P2). Styling lives entirely in
     sidepanel.css — this file only carries structure. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Meeting Ghost</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="setup-screen">
      <h2>Set up Ghost</h2>
      <label>
        Your name
        <input id="setup-name" type="text" placeholder="e.g. Aman" />
      </label>
      <label>
        Other name variants (comma-separated, optional)
        <input id="setup-name-variants" type="text" placeholder="e.g. Aman Kumar" />
      </label>
      <label>
        Your Slack user ID or email
        <input id="setup-slack-target" type="text" placeholder="e.g. aman@example.com" />
      </label>
      <button id="setup-save-btn">Save &amp; Continue</button>
      <div id="setup-error" class="hidden"></div>
    </div>

    <div id="main-screen" class="hidden">
      <div id="listening-indicator" class="hidden">
        <span class="pulse-dot"></span>
        <span id="listening-text">Ghost is listening</span>
        <div id="meeting-meta"></div>
      </div>

      <div class="controls-row">
        <button id="start-btn">Start listening</button>
        <button id="stop-btn" class="hidden">Stop Ghost</button>
        <button id="settings-btn" class="secondary-btn" title="Edit settings">⚙️ Settings</button>
      </div>
      <div id="status-text">Ghost is idle.</div>

      <div id="speaker-override">
        <h3>Speaker override</h3>
        <div class="row">
          <input id="override-label" type="text" placeholder="e.g. spk_0" />
          <input id="override-name" type="text" placeholder="e.g. Priya" />
          <button id="override-apply-btn">Apply</button>
        </div>
      </div>

      <div id="active-decision" class="hidden"></div>

      <div id="backend-unreachable" class="hidden">
        <p>Can't reach Ghost's backend.</p>
        <button id="retry-btn">Retry</button>
      </div>

      <div id="search-box">
        <input id="search-input" type="text" placeholder="Search decisions…" />
      </div>

      <div id="decision-list"></div>
      <div id="decision-list-empty" class="hidden">No decisions yet.</div>
    </div>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
